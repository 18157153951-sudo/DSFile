name: Build Inject Dylib

on:
  push:
    branches: [inject-dylib]
    paths:
      - 'InjectDylib/**'
      - '.github/workflows/build-inject-dylib.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: InjectDylib
        run: xcodegen generate

      - name: 编译 dylib（不签名）
        working-directory: InjectDylib
        run: |
          xcodebuild build \
            -project MyfilzaReplace.xcodeproj \
            -target MyfilzaReplace \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO

      - name: 确认产物与关键符号
        working-directory: InjectDylib
        run: |
          DYLIB=build/Release-iphoneos/MyfilzaReplace.dylib
          ls -lh "$DYLIB"
          echo "== 架构 =="
          lipo -info "$DYLIB"
          echo "== 依赖（应只有系统库） =="
          otool -L "$DYLIB"
          if otool -L "$DYLIB" | tail -n +2 | grep -v -E '/usr/lib/|/System/Library/' | grep -v 'MyfilzaReplace.dylib'; then
            echo "❌ 出现了非系统库依赖"; exit 1
          fi
          echo "== ObjC 类符号 =="
          SYMS=$(nm -gU "$DYLIB")
          for SYMBOL in '_OBJC_CLASS_$_DSKernel' '_OBJC_CLASS_$_DSPickers' '_OBJC_CLASS_$_DSProcess' '_OBJC_CLASS_$_DSShell' 'MyfilzaReplaceLauncher'; do
            if echo "$SYMS" | grep -q "$SYMBOL"; then
              echo "✅ 找到 $SYMBOL"
            else
              echo "❌ 缺少 $SYMBOL"; echo "$SYMS" | head -40; exit 1
            fi
          done
          echo "== 确认替换向导真的被编进来了（grep 二进制：strings 会跳过非 ASCII，所以直接用 grep -a） =="
          for TEXT in 'ReplaceWizardView' 'ReplaceWizardModel' 'TargetFileBrowser' 'myfilza-inject.log' 'AutoTasks'; do
            if grep -a -q "$TEXT" "$DYLIB"; then
              echo "✅ 含向导标识：$TEXT"
            else
              echo "❌ 找不到向导标识：$TEXT"; exit 1
            fi
          done
          echo "== 确认没有内核代码被带进来（应为空） =="
          if nm -gU "$DYLIB" 2>/dev/null | grep -E 'kexploit|early_kread|DSCredEscape|DS3105|clearsword'; then
            echo "❌ 发现内核符号（注入版不应包含）"; exit 1
          else
            echo "（无内核符号，符合预期）"
          fi

      - name: 计算校验值并打包
        working-directory: InjectDylib
        run: |
          DYLIB=build/Release-iphoneos/MyfilzaReplace.dylib
          echo "SHA256: $(shasum -a 256 "$DYLIB" | awk '{print $1}')"
          mkdir -p out
          cp "$DYLIB" out/MyfilzaReplace.dylib

      - name: 上传 dylib
        uses: actions/upload-artifact@v4
        with:
          name: MyfilzaReplace-dylib
          path: InjectDylib/out/MyfilzaReplace.dylib
          if-no-files-found: error
          retention-days: 30
