name: Build App

on:
  push:
    branches: [main, master]
    paths:
      - 'DSFile/**'
      - 'FilzaTweak/**'
      - '.github/workflows/build-app.yml'
  pull_request:
    paths:
      - 'DSFile/**'
      - 'FilzaTweak/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成 Xcode 工程
        working-directory: DSFile
        run: xcodegen generate

      - name: 打上构建标记
        working-directory: DSFile
        run: |
          STAMP="$(git rev-parse --short HEAD) · $(date -u '+%m-%d %H:%M')"
          sed -i '' -e "s|static let stamp = \"dev\"|static let stamp = \"${STAMP}\"|" Sources/Core/BuildInfo.swift
          cat Sources/Core/BuildInfo.swift

      - name: 编译 App（不签名）
        working-directory: DSFile
        run: |
          xcodebuild build \
            -project myfilza.xcodeproj \
            -target myfilza \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO

      - name: 确认漏洞代码真的被链进去了
        working-directory: DSFile
        run: |
          BIN=build/Release-iphoneos/myfilza.app/myfilza
          ls -lh "$BIN"
          for SYMBOL in kexploit_opa334 DSCredEscapeSandbox xpf_start_with_kernel_path; do
            if nm -a "$BIN" 2>/dev/null | grep -q "$SYMBOL"; then
              echo "✅ 找到符号 $SYMBOL"
            else
              echo "❌ 二进制里没有 $SYMBOL —— 内核逃逸代码没编进去，装上去也是白装"
              exit 1
            fi
          done
          echo "== 架构 =="
          lipo -info "$BIN"

      - name: 打包未签名 IPA（常规 + MHA 变体）
        working-directory: DSFile
        run: |
          rm -rf Payload Payload-mha DSFile.ipa myfilza-mha.ipa
          mkdir -p Payload Payload-mha
          cp -R build/Release-iphoneos/myfilza.app Payload/
          cp -R build/Release-iphoneos/myfilza.app Payload-mha/
          zip -qry DSFile.ipa Payload
          # MHA 变体：把 Bundle ID 伪装成 Apple 的容器访问守护进程
          # com.apple.mobile.MobileHouseArrest —— iOS 会据此下发特权沙盒 profile，
          # 于是不跑任何内核漏洞就能读写别的 App 容器（3105 在 iOS 18.x 上用的就是这招）。
          # 显示名改成 myfilza MHA，方便和常规包区分。
          /usr/bin/plutil -replace CFBundleIdentifier -string 'com.apple.mobile.MobileHouseArrest' Payload-mha/myfilza.app/Info.plist
          /usr/bin/plutil -replace CFBundleDisplayName -string 'myfilza MHA' Payload-mha/myfilza.app/Info.plist
          /usr/bin/plutil -replace CFBundleName -string 'myfilzaMHA' Payload-mha/myfilza.app/Info.plist
          # 关键：IPA 的顶层目录必须叫 Payload/，否则签名工具会报「未找到 .app」
          # （之前这里直接 zip Payload-mha，导致变体包顶层是 Payload-mha/ 而无法导入）
          mv Payload-mha Payload
          zip -qry myfilza-mha.ipa Payload
          echo "== 校验 MHA 变体的 IPA 结构 =="
          unzip -l myfilza-mha.ipa | head -8
          unzip -l myfilza-mha.ipa | grep -q 'Payload/myfilza.app/' \
            || { echo 'MHA 变体包结构错误：顶层不是 Payload/'; exit 1; }
          ls -lh DSFile.ipa myfilza-mha.ipa
          echo "常规 SHA256: $(shasum -a 256 DSFile.ipa | awk '{print $1}')"
          echo "MHA  SHA256: $(shasum -a 256 myfilza-mha.ipa | awk '{print $1}')"
          echo "== MHA 变体的 Info.plist 关键字段 =="
          /usr/bin/plutil -p Payload/myfilza.app/Info.plist | grep -E 'CFBundleIdentifier|CFBundleDisplayName|CFBundleName'

      - name: 上传 IPA
        uses: actions/upload-artifact@v4
        with:
          name: DSFile-ipa
          path: |
            DSFile/DSFile.ipa
            DSFile/myfilza-mha.ipa
          if-no-files-found: error
          retention-days: 30
