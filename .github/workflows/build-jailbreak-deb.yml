name: Build Jailbreak Deb

# 越狱版（.deb + 手动安装包）：给 roothide / rootless / 经典越狱用。
#
# 为什么必须单独出这个包（真机依据）：
#   在 roothide 上，**TrollStore / 普通证书安装的 App 仍然受沙盒限制** —— roothide 的
#   设计目标就是「对 App 隐藏越狱」。只有装进越狱根（<jbroot>/Applications/）并带上
#   越狱 entitlements 的**越狱 App** 才能读写全盘。
#
# 规范依据（全部来自 roothide 官方文档与真实包，非猜测）：
#   · roothide/Developer/roothide.md：
#       - "roothide ... (re)installs the jailbreak to a directory(named jbroot) with a random name"
#       - "each directory containing a mach-o file will automatically generate a .jbroot
#          symbolic link that pointing to the jailbreak root directory, it's usually generated
#          by dpkg when installing packages"
#       - "roothide's bootstrap uses jbroot as the default root"；jbroot 内有名为 "rootfs" 的
#         符号链接指向 iOS 原始根文件系统（只读）→ 所以 dpkg 报 "./rootfs/... Read-only
#         file system" 就说明包被当成要写真实 rootfs 了，本 workflow 会自检排除这种情况。
#   · roothide/Developer/entitlements.md：越狱二进制的基础 entitlements 是
#       platform-application / com.apple.private.security.no-sandbox /
#       com.apple.private.security.storage.AppBundles /
#       com.apple.private.security.storage.AppDataContainers
#     （0.9.1 之前我们少了后两个 —— 那两个正是"读写 App 包体/数据容器"要用的）
#   · 真实 roothide 包样例（roothide/roothide.github.io/debfiles/ 里的 cocoatop.deb、
#     apt.tinyapps.Renet-*.deb）：data 布局为 ./Applications/<Name>.app/...，
#     Architecture 一律 iphoneos-arm64e，postinst 里会 chown/ldid -s/uicache。
#
# 0.9.5：与 App 版本同步（App 侧修「越狱版/MHA 已能用却被拦下」，安装流程无改动）
# 0.9.4：安装全自动（装上即用）—— postinst 与 install.sh 一致：
#        定位 jbroot → .jbroot 链接 → chown/chmod → ldid 重签 → 多路 uicache →
#        **自动 respring（sbreload → killall -9 SpringBoard → launchctl kickstart）** → 打印结论
# 0.9.3：postinst 里 uicache 改绝对路径+多路尝试且全部打印；补 .jbroot 符号链接（装完没图标的主因）
# 0.9.2：
#   · 架构字段改为 iphoneos-arm64e（并额外产出一个 iphoneos-arm64 变体兜底）
#   · entitlements 用官方四件套（+ container-required=false / get-task-allow）
#   · postinst 在设备上再用 ldid 重新签名一次（防止安装过程丢掉签名）
#   · 新增**手动安装包** myfilza-jb-manual.zip（app + entitlements.plist + install.sh + README）
#     —— deb 装不上时（dpkg 报 rootfs 只读）用它能直接装。

on:
  push:
    branches: [main, master]
    paths:
      - 'DSFile/**'
      - 'FilzaTweak/**'
      - 'jailbreak/**'
      - '.github/workflows/build-jailbreak-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  VERSION: 0.9.5

jobs:
  deb:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen / ldid / dpkg
        run: brew install xcodegen ldid dpkg

      - name: 生成 Xcode 工程
        working-directory: DSFile
        run: xcodegen generate

      - name: 打上构建标记
        working-directory: DSFile
        run: |
          STAMP="$(git rev-parse --short HEAD) · $(date -u '+%m-%d %H:%M')"
          sed -i '' -e "s|static let stamp = \"dev\"|static let stamp = \"${STAMP}\"|" Sources/Core/BuildInfo.swift
          cat Sources/Core/BuildInfo.swift

      - name: 编译 App（不签名）
        working-directory: DSFile
        run: |
          xcodebuild build \
            -project myfilza.xcodeproj \
            -target myfilza \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO

      - name: 注入越狱 entitlements 并 ad-hoc 签名（ldid）
        working-directory: DSFile
        run: |
          set -e
          APP=build/Release-iphoneos/myfilza.app
          BIN="$APP/myfilza"
          ENT=../jailbreak/entitlements.plist
          test -f "$BIN" || { echo "❌ 找不到可执行文件 $BIN"; exit 1; }
          test -f "$ENT" || { echo "❌ 找不到 $ENT"; exit 1; }

          # 显示名区分开：越狱版叫 myfilza JB
          /usr/bin/plutil -replace CFBundleDisplayName -string 'myfilza JB' "$APP/Info.plist" || true
          /usr/bin/plutil -replace CFBundleName -string 'myfilzaJB' "$APP/Info.plist" || true
          # ★ bundle id 必须与侧载版**不同**（0.9.0 时两边都是 com.dsfile.app，装上去互相顶）
          /usr/bin/plutil -replace CFBundleIdentifier -string 'com.dsfile.app.jb' "$APP/Info.plist"
          JB_ID="$(/usr/bin/plutil -extract CFBundleIdentifier raw "$APP/Info.plist")"
          echo "CFBundleIdentifier = $JB_ID"
          [ "$JB_ID" = 'com.dsfile.app.jb' ] \
            || { echo "❌ 越狱版 bundle id 不是 com.dsfile.app.jb（当前=$JB_ID）"; exit 1; }

          # 主可执行文件 + 包内任何 dylib / framework 都签上（越狱 App 必须带沙盒例外）
          ldid -S"$ENT" "$BIN"
          find "$APP" -type f \( -name '*.dylib' -o -path '*.framework/*' \) -print0 2>/dev/null \
            | xargs -0 -I{} ldid -S"$ENT" "{}" 2>/dev/null || true

          echo "== 校验签名里的 entitlements（官方四件套必须都在）=="
          ldid -e "$BIN"
          for K in platform-application \
                   com.apple.private.security.no-sandbox \
                   com.apple.private.security.storage.AppBundles \
                   com.apple.private.security.storage.AppDataContainers; do
            ldid -e "$BIN" | grep -q "$K" \
              || { echo "❌ 签名里缺少 $K —— 装上去也读不到 App 包体/容器"; exit 1; }
          done
          echo "== 架构 =="
          lipo -info "$BIN"
          /usr/bin/plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleDisplayName|CFBundleName'

      - name: 打包 .deb（两种架构字段各一份）
        working-directory: DSFile
        run: |
          set -e
          APP=build/Release-iphoneos/myfilza.app
          rm -rf debroot debian-binary control.tar.* data.tar.* ./*.deb

          mkdir -p debroot/Applications debroot/DEBIAN
          cp -R "$APP" debroot/Applications/

          PKG_ID="$(/usr/bin/plutil -extract CFBundleIdentifier raw debroot/Applications/myfilza.app/Info.plist)"
          PKG_NAME="$(/usr/bin/plutil -extract CFBundleDisplayName raw debroot/Applications/myfilza.app/Info.plist)"
          echo "deb 内 App: bundle id=$PKG_ID  显示名=$PKG_NAME"
          [ "$PKG_ID" = 'com.dsfile.app.jb' ] || { echo "❌ deb 里的 bundle id 不对（$PKG_ID）"; exit 1; }
          [ "$PKG_NAME" = 'myfilza JB' ] || { echo "❌ deb 里的显示名不对（$PKG_NAME）"; exit 1; }

          # postinst：**装上即用** —— 自动补签名、建 .jbroot 链接、修权限、注册图标、刷新桌面。
          # 与 jailbreak/install.sh 的行为保持一致（两条安装路等价）。
          cat > debroot/DEBIAN/postinst <<'POSTINST'
          #!/bin/sh
          # roothide/rootless 的 bootstrap 工具只认 jbroot 相对路径：
          # 这里的 /Applications/myfilza.app 就是 <jbroot>/Applications/myfilza.app
          set -u
          APP=/Applications/myfilza.app
          LOG() { echo "[myfilza] $*"; }

          # 0) 定位 jbroot（.jbroot 链接要用；dpkg 一般已设置 JBROOT）
          JB="${JBROOT:-}"
          if [ -z "$JB" ] && command -v jbroot >/dev/null 2>&1; then JB="$(jbroot / 2>/dev/null || true)"; fi
          if [ -z "$JB" ]; then
            for D in /Applications /usr/bin /usr/lib; do
              if [ -L "$D/.jbroot" ]; then JB="$(readlink "$D/.jbroot" 2>/dev/null || true)"; [ -n "$JB" ] && break; fi
            done
          fi
          if [ -n "$JB" ]; then LOG "jbroot = $JB"; else LOG "未取到 jbroot（dpkg 一般会自动生成 .jbroot）"; fi

          # 1) 权限
          chown -R 0:0 "$APP" 2>/dev/null || true
          chmod 755 "$APP" 2>/dev/null || true
          chmod 755 "$APP/myfilza" 2>/dev/null || true
          find "$APP" -type d -exec chmod 755 {} \; 2>/dev/null || true

          # 2) 重新签名（安装过程可能丢签名；ldid 是 bootstrap 自带的）
          if command -v ldid >/dev/null 2>&1; then
            cat > /tmp/myfilza-jb-ent.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key><true/>
              <key>com.apple.private.security.no-sandbox</key><true/>
              <key>com.apple.private.security.storage.AppBundles</key><true/>
              <key>com.apple.private.security.storage.AppDataContainers</key><true/>
              <key>com.apple.private.security.container-required</key><false/>
              <key>get-task-allow</key><true/>
          </dict>
          </plist>
          PLIST
            ldid -S/tmp/myfilza-jb-ent.plist "$APP/myfilza" 2>/dev/null || true
            find "$APP" -type f \( -name '*.dylib' -o -path '*.framework/*' \) -print0 2>/dev/null \
              | xargs -0 -I{} ldid -S/tmp/myfilza-jb-ent.plist "{}" 2>/dev/null || true
            for K in platform-application com.apple.private.security.no-sandbox \
                     com.apple.private.security.storage.AppBundles \
                     com.apple.private.security.storage.AppDataContainers; do
              if ldid -e "$APP/myfilza" 2>/dev/null | grep -q "$K"; then LOG "  ✓ $K"; else LOG "  ✗ 缺 $K"; fi
            done
            rm -f /tmp/myfilza-jb-ent.plist
          else
            LOG "⚠️ 找不到 ldid，跳过重签（可能仍可运行）"
          fi

          # 3) .jbroot 链接（roothide 机制：含 mach-o 的目录要有 .jbroot 指向越狱根）
          if [ -e "$APP/.jbroot" ]; then
            LOG ".jbroot 已存在: $(readlink "$APP/.jbroot" 2>/dev/null)"
          elif [ -n "$JB" ]; then
            ln -s "$JB" "$APP/.jbroot" 2>/dev/null && LOG ".jbroot -> $JB"
          else
            LOG "提示：未取到 jbroot，跳过 .jbroot 创建"
          fi

          # 4) uicache：绝对路径 + 多路尝试，且**全部打印**（静默失败是"装完没图标"的主因）
          UICOK=0
          for U in /usr/bin/uicache /bin/uicache "$(command -v uicache 2>/dev/null || true)"; do
            [ -n "$U" ] && [ -x "$U" ] || continue
            for A in -a --all; do
              LOG "uicache: $U $A"
              if "$U" "$A"; then UICOK=1; break; fi
            done
            [ "$UICOK" = "1" ] && break
            LOG "uicache: $U -p $APP"
            if "$U" -p "$APP"; then UICOK=1; break; fi
          done
          if [ "$UICOK" = "1" ]; then LOG "uicache 成功"; else LOG "⚠️ uicache 全部失败"; fi

          # 5) 自动刷新桌面（装上即用的关键：不用用户自己 respring）
          LOG "即将刷新桌面（图标会立刻出现）…"
          RESPRUNG=0
          if command -v sbreload >/dev/null 2>&1; then sbreload && RESPRUNG=1; fi
          if [ "$RESPRUNG" = "0" ] && command -v killall >/dev/null 2>&1; then killall -9 SpringBoard && RESPRUNG=1; fi
          if [ "$RESPRUNG" = "0" ]; then launchctl kickstart -k system/com.apple.SpringBoard && RESPRUNG=1; fi
          if [ "$RESPRUNG" = "1" ]; then LOG "桌面已刷新"; else LOG "自动刷新未成功，请手动执行 sbreload"; fi

          LOG "完成：去桌面点「myfilza JB」（默认「自动」模式会优先走越狱路径，无需设置）"
          exit 0
          POSTINST
          chmod 755 debroot/DEBIAN/postinst

          cat > debroot/DEBIAN/prerm <<'PRERM'
          #!/bin/sh
          set -u
          # 卸载时同步刷新图标与桌面，避免留下"幽灵图标"
          UICOK=0
          for U in /usr/bin/uicache /bin/uicache "$(command -v uicache 2>/dev/null || true)"; do
            [ -n "$U" ] && [ -x "$U" ] || continue
            if "$U" -a; then UICOK=1; break; fi
          done
          if command -v sbreload >/dev/null 2>&1; then sbreload || true
          elif command -v killall >/dev/null 2>&1; then killall -9 SpringBoard || true
          fi
          exit 0
          PRERM
          chmod 755 debroot/DEBIAN/prerm

          build_one () {
            ARCH="$1"
            DEB="myfilza_${VERSION}_${ARCH}.deb"
            cat > debroot/DEBIAN/control <<EOF
          Package: com.dsfile.myfilza
          Name: myfilza
          Version: ${VERSION}
          Architecture: ${ARCH}
          Section: Utilities
          Priority: optional
          Depends: firmware (>= 15.0)
          Maintainer: duanmuawa
          Author: duanmuawa
          Description: myfilza 越狱版（替换引擎）
           越狱模式专用包：装进 <jbroot>/Applications/，带越狱 entitlements，
           不跑任何内核漏洞即可读写系统路径与其它 App 容器。
           TrollStore / 普通证书安装的 App 在 roothide 下不会获得越狱权限，所以需要这个包。
           本包 bundle id = com.dsfile.app.jb（侧载版是 com.dsfile.app，两个 App 互不影响）。
          EOF

            rm -f "$DEB"
            dpkg-deb --build --root-owner-group debroot "$DEB"

            echo "== 校验 $DEB =="
            dpkg-deb -I "$DEB" | grep -E 'Package:|Version:|Architecture:' | sed 's/^/   /'
            # ① 架构字段必须与文件名一致
            dpkg-deb -f "$DEB" Architecture | grep -qx "$ARCH" \
              || { echo "❌ $DEB 的 Architecture 字段不是 $ARCH"; exit 1; }
            # ② 文件清单必须含 app 可执行文件，且**不能**出现 rootfs/ 前缀
            dpkg-deb -c "$DEB" | grep -qE 'Applications/myfilza\.app/myfilza$' \
              || { echo "❌ $DEB 里没有 Applications/myfilza.app/myfilza"; exit 1; }
            if dpkg-deb -c "$DEB" | grep -q 'rootfs/'; then
              echo "❌ $DEB 的路径里出现 rootfs/ —— 会被 dpkg 当成要写真实 rootfs（只读）"
              exit 1
            fi
            # ③ 安装脚本必须真的自动化（装上即用）：绝对路径 uicache + 自动 respring + .jbroot + ldid
            rm -rf /tmp/myfilza-deb-ctl
            dpkg-deb -e "$DEB" /tmp/myfilza-deb-ctl 2>/dev/null
            grep -q '/usr/bin/uicache' /tmp/myfilza-deb-ctl/postinst \
              || { echo "❌ $DEB 的 postinst 没有绝对路径 uicache"; exit 1; }
            grep -q 'sbreload' /tmp/myfilza-deb-ctl/postinst \
              || { echo "❌ $DEB 的 postinst 没有自动 respring（sbreload）"; exit 1; }
            grep -q '\.jbroot' /tmp/myfilza-deb-ctl/postinst \
              || { echo "❌ $DEB 的 postinst 没有创建 .jbroot 链接"; exit 1; }
            grep -q 'ldid' /tmp/myfilza-deb-ctl/postinst \
              || { echo "❌ $DEB 的 postinst 没有 ldid 重签"; exit 1; }
            rm -rf /tmp/myfilza-deb-ctl
            echo "   ✓ 架构字段、文件清单、无 rootfs/ 前缀 全部通过"
            echo "   ✓ postinst 自检通过（绝对路径 uicache / 自动 respring / .jbroot / ldid 重签）"
            echo "   SHA256: $(shasum -a 256 "$DEB" | awk '{print $1}')"
          }

          # 真实 roothide 包（cocoatop / Renet / Comet …）一律是 iphoneos-arm64e
          build_one iphoneos-arm64e
          # 非 arm64e 设备兜底
          build_one iphoneos-arm64
          ls -lh ./*.deb

      - name: 打包手动安装包（app + entitlements + install.sh + README）
        working-directory: DSFile
        run: |
          set -e
          STAGE=manual-stage
          rm -rf "$STAGE" myfilza-jb-manual.zip
          mkdir -p "$STAGE"
          cp -R build/Release-iphoneos/myfilza.app "$STAGE/"
          cp ../jailbreak/entitlements.plist "$STAGE/"
          cp ../jailbreak/install.sh "$STAGE/"
          cp ../jailbreak/README.txt "$STAGE/"
          chmod 755 "$STAGE/install.sh"
          # 保证脚本是 LF 行尾（Windows 上编辑过也不会带 CR）
          perl -pi -e 's/\r\n/\n/g' "$STAGE/install.sh" "$STAGE/README.txt"
          ( cd "$STAGE" && zip -qry ../myfilza-jb-manual.zip . )
          echo "== 手动包内容 =="
          unzip -l myfilza-jb-manual.zip | head -20
          unzip -l myfilza-jb-manual.zip | grep -q 'myfilza.app/myfilza$' \
            || { echo '❌ 手动包里没有 myfilza.app/myfilza'; exit 1; }
          unzip -l myfilza-jb-manual.zip | grep -q 'install.sh' \
            || { echo '❌ 手动包里没有 install.sh'; exit 1; }
          unzip -l myfilza-jb-manual.zip | grep -q 'entitlements.plist' \
            || { echo '❌ 手动包里没有 entitlements.plist'; exit 1; }
          # 安装脚本必须全自动（装上即用）：自动 respring + 可选 --check
          grep -q 'sbreload' "$STAGE/install.sh" \
            || { echo '❌ install.sh 没有自动 respring（sbreload）'; exit 1; }
          grep -q -- '--check' "$STAGE/install.sh" \
            || { echo '❌ install.sh 缺少 --check 体检模式'; exit 1; }
          grep -q 'storage.AppDataContainers' "$STAGE/entitlements.plist" \
            || { echo '❌ entitlements.plist 缺 storage.AppDataContainers'; exit 1; }
          grep -q 'apt-get' "$STAGE/install.sh" \
            || { echo '❌ install.sh 没有自动安装 ldid 的逻辑'; exit 1; }
          sh -n "$STAGE/install.sh" || { echo '❌ install.sh 语法检查未通过'; exit 1; }
          echo "   ✓ install.sh 自检通过（自动 respring / --check / 自动装 ldid / 语法 OK）"
          ls -lh myfilza-jb-manual.zip
          echo "SHA256: $(shasum -a 256 myfilza-jb-manual.zip | awk '{print $1}')"

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: myfilza-deb
          path: |
            DSFile/myfilza_*_iphoneos-arm64e.deb
            DSFile/myfilza_*_iphoneos-arm64.deb
          if-no-files-found: error
          retention-days: 30

      - name: 上传手动安装包
        uses: actions/upload-artifact@v4
        with:
          name: myfilza-jb-manual
          path: DSFile/myfilza-jb-manual.zip
          if-no-files-found: error
          retention-days: 30
