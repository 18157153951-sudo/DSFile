name: Build Jailbreak Deb

# 越狱版（.deb）：给 roothide / rootless / 经典越狱用。
#
# 为什么必须单独出这个包（真机依据）：
#   在 roothide 上，**TrollStore 安装的 App 仍然受沙盒限制** —— roothide 的设计目标就是
#   「对 App 隐藏越狱」。只有装进越狱根（<jbroot>/Applications/）的**越狱 App**
#   （带 platform-application 沙盒例外）才能读写全盘。所以这里用 ldid 注入越狱 entitlements
#   再打成 deb，用 Sileo / Zebra 安装。
#
# roothide 路径规范依据（roothide/Developer/roothide.md，原文）：
#   · "roothide ... (re)installs the jailbreak to a directory(named jbroot) with a random name"
#   · "each directory containing a mach-o file will automatically generate a .jbroot symbolic link
#      that pointing to the jailbreak root directory, it's usually generated by dpkg when installing packages"
#   · "roothide's bootstrap uses jbroot as the default root" → 包内路径按 jbroot 相对写
#   所以 deb 的 data 布局用 ./Applications/myfilza.app/...（装完即 <jbroot>/Applications/...），
#   并且 dpkg 安装时会在 app 目录里生成 .jbroot 符号链接 —— 我们的 jbroot 解析正是靠它。

on:
  push:
    branches: [main, master]
    paths:
      - 'DSFile/**'
      - 'FilzaTweak/**'
      - '.github/workflows/build-jailbreak-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: 安装 XcodeGen / ldid / dpkg
        run: brew install xcodegen ldid dpkg

      - name: 生成 Xcode 工程
        working-directory: DSFile
        run: xcodegen generate

      - name: 打上构建标记
        working-directory: DSFile
        run: |
          STAMP="$(git rev-parse --short HEAD) · $(date -u '+%m-%d %H:%M')"
          sed -i '' -e "s|static let stamp = \"dev\"|static let stamp = \"${STAMP}\"|" Sources/Core/BuildInfo.swift
          cat Sources/Core/BuildInfo.swift

      - name: 编译 App（不签名）
        working-directory: DSFile
        run: |
          xcodebuild build \
            -project myfilza.xcodeproj \
            -target myfilza \
            -configuration Release \
            -sdk iphoneos \
            CONFIGURATION_BUILD_DIR="$PWD/build/Release-iphoneos" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COPY_PHASE_STRIP=NO \
            STRIP_INSTALLED_PRODUCT=NO

      - name: 注入越狱 entitlements 并 ad-hoc 签名（ldid）
        working-directory: DSFile
        run: |
          set -e
          APP=build/Release-iphoneos/myfilza.app
          BIN="$APP/myfilza"
          test -f "$BIN" || { echo "❌ 找不到可执行文件 $BIN"; exit 1; }

          # 显示名区分开：同一个 bundle id 的侧载版叫 myfilza，越狱版叫 myfilza JB
          /usr/bin/plutil -replace CFBundleDisplayName -string 'myfilza JB' "$APP/Info.plist" || true

          cat > entitlements.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>platform-application</key>
              <true/>
              <key>com.apple.private.security.container-required</key>
              <false/>
              <key>com.apple.private.security.no-sandbox</key>
              <true/>
              <key>get-task-allow</key>
              <true/>
          </dict>
          </plist>
          PLIST

          # 主可执行文件 + 包内任何 dylib / framework 都签上（越狱 App 必须带沙盒例外）
          ldid -Sentitlements.plist "$BIN"
          find "$APP" -type f \( -name '*.dylib' -o -path '*.framework/*' \) -print0 2>/dev/null \
            | xargs -0 -I{} ldid -Sentitlements.plist "{}" 2>/dev/null || true

          echo "== 校验签名里的 entitlements =="
          ldid -e "$BIN"
          ldid -e "$BIN" | grep -q 'platform-application' \
            || { echo '❌ 签名里没有 platform-application —— 装上去也不会获得越狱权限'; exit 1; }
          ldid -e "$BIN" | grep -A1 'container-required' | grep -q '<false/>' \
            || { echo '❌ container-required 不是 false'; exit 1; }
          echo "== 架构 =="
          lipo -info "$BIN"
          echo "== bundle id / 显示名 =="
          /usr/bin/plutil -p "$APP/Info.plist" | grep -E 'CFBundleIdentifier|CFBundleDisplayName'

      - name: 打包 .deb（rootless / roothide 规范：./Applications/...）
        working-directory: DSFile
        run: |
          set -e
          VERSION=0.9.0
          APP=build/Release-iphoneos/myfilza.app
          PKG=debroot
          rm -rf "$PKG" debian-binary control.tar.gz data.tar.gz ./*.deb

          mkdir -p "$PKG/Applications" "$PKG/DEBIAN"
          cp -R "$APP" "$PKG/Applications/"

          cat > "$PKG/DEBIAN/control" <<EOF
          Package: com.dsfile.myfilza
          Name: myfilza
          Version: $VERSION
          Architecture: iphoneos-arm64
          Section: Utilities
          Priority: optional
          Depends: firmware (>= 15.0)
          Maintainer: duanmuawa
          Author: duanmuawa
          Description: myfilza 越狱版（替换引擎）
           越狱模式专用包：装进 <jbroot>/Applications/，带 platform-application 沙盒例外，
           不跑任何内核漏洞即可读写系统路径与其它 App 容器。
           TrollStore 安装的 App 在 roothide 下不会获得越狱权限，所以需要这个包。
          EOF

          cat > "$PKG/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          # roothide / rootless 的 bootstrap 工具只认 jbroot 相对路径，
          # 所以这里的 /Applications/myfilza.app 就是 <jbroot>/Applications/myfilza.app
          set -e
          if command -v uicache >/dev/null 2>&1; then
            uicache -a >/dev/null 2>&1 || uicache -p /Applications/myfilza.app >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG/DEBIAN/postinst"

          cat > "$PKG/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e
          if command -v uicache >/dev/null 2>&1; then
            uicache -a >/dev/null 2>&1 || true
          fi
          exit 0
          EOF
          chmod 755 "$PKG/DEBIAN/prerm"

          DEB="myfilza_${VERSION}_iphoneos-arm64.deb"
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb --build --root-owner-group "$PKG" "$DEB"
          else
            # 兜底：手工 ar 打包（debian-binary + control.tar.gz + data.tar.gz，顺序不能变）
            printf '2.0\n' > debian-binary
            ( cd "$PKG/DEBIAN" && tar czf ../control.tar.gz --owner=0 --group=0 . )
            ( cd "$PKG" && tar czf ../data.tar.gz --owner=0 --group=0 ./Applications )
            ar rc "$DEB" debian-binary control.tar.gz data.tar.gz
          fi

          echo "== 校验 .deb =="
          ls -lh "$DEB"
          echo "--- 成员 ---"
          if command -v dpkg-deb >/dev/null 2>&1; then
            dpkg-deb -I "$DEB" | head -30
            echo "--- 文件清单（应含 Applications/myfilza.app/myfilza）---"
            dpkg-deb -c "$DEB" | grep -E 'Applications/myfilza\.app/myfilza$'
            dpkg-deb -c "$DEB" | grep -qE 'Applications/myfilza\.app/myfilza$' \
              || { echo '❌ deb 里没有 Applications/myfilza.app/myfilza'; exit 1; }
          else
            ar t "$DEB"
            tar tzf data.tar.gz | grep -q 'Applications/myfilza.app/myfilza' \
              || { echo '❌ data.tar.gz 里没有 Applications/myfilza.app/myfilza'; exit 1; }
          fi
          echo "SHA256: $(shasum -a 256 "$DEB" | awk '{print $1}')"

      - name: 上传 .deb
        uses: actions/upload-artifact@v4
        with:
          name: myfilza-deb
          path: DSFile/myfilza_*_iphoneos-arm64.deb
          if-no-files-found: error
          retention-days: 30
