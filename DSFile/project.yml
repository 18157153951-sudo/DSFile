name: myfilza
options:
  bundleIdPrefix: com.dsfile
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
  groupSortPosition: top

targets:
  myfilza:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # ===== 内核层：FilzaJailedDS 原版实现（漏洞 + 沙盒逃逸 + 提权）=====
      # 源码与上游 tag 2.2（commit 49c3a90）逐字节一致，零修改（见 FilzaTweak/NOTICE.md）。
      - path: ../FilzaTweak/kexploit
      - path: ../FilzaTweak/kpf
      - path: ../FilzaTweak/utils
      - path: ../FilzaTweak/XPF
      - path: ../FilzaTweak/sandbox_escape.m
      - path: ../FilzaTweak/apfs_own.m
      # 故意不包含 ../FilzaTweak/Tweak.m（那是给 Filza 用的 hook 层，App 里不需要）
      # 旧后端 ClearSword / lara / DSEscape 留在仓库做对照与回退，不参与编译。
      # ===== 内核层（第二种后端）：3105 =====
      # 与上面 FilzaJailedDS **完全隔离**：自带一份同名的 kexploit/krw 实现，
      # 其自有符号经 DS3105SymbolPrefix.h 统一改名 t3105_*，因此两者可共存于同一可执行文件。
      # 源码逐字节原样（来源与许可证 GPL-3.0 见 Vendor/ThreeOneOSFive/{LICENSE,THIRD_PARTY_NOTICES.md}）。
# 注意：compilerFlags 只在**文件级** source 生效，目录级会被 XcodeGen 忽略（第一次 CI 因此出现重复符号）。
# 所以这里逐个文件列出；源码本身仍逐字节原样，没有改动。
      - path: Vendor/ThreeOneOSFive/exploit/bad_query.c
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/exploit/mcm_bridge.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/exploit/wallpaper_zip.c
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/kexploit_opa334.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/krw.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/kutils.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/offsets.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/sandbox_escape.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
      - path: Vendor/ThreeOneOSFive/kexploit/vnode.m
        compilerFlags: -include $(SRCROOT)/Vendor/ThreeOneOSFive/DS3105SymbolPrefix.h
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: myfilza
        CFBundleName: myfilza
        UILaunchScreen: {}
        # 让 App 自己的 Documents 在「文件」App 里可见，方便导入脚本 / 导出日志
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # 我们不做任何网络请求；这里保持默认，不放开明文 HTTP
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_NAME: myfilza
        PRODUCT_BUNDLE_IDENTIFIER: com.dsfile.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.8.1"
        CURRENT_PROJECT_VERSION: "8"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # 出的是未签名 IPA，签名交给 eSign / 证书重签，entitlements 保持干净
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        ARCHS: arm64
        ONLY_ACTIVE_ARCH: NO
        ENABLE_BITCODE: NO
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Core/DSFile-Bridging-Header.h
        CLANG_ENABLE_MODULES: YES
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_C_LANGUAGE_STANDARD: gnu11
        HEADER_SEARCH_PATHS:
          - $(SRCROOT)/../FilzaTweak
          - $(SRCROOT)/../FilzaTweak/kexploit
          - $(SRCROOT)/../FilzaTweak/kpf
          - $(SRCROOT)/../FilzaTweak/utils
          - $(SRCROOT)/../FilzaTweak/XPF/src
          - $(SRCROOT)/../FilzaTweak/XPF/external/ChOma/include
          - $(SRCROOT)/Sources/Core
        OTHER_CFLAGS:
          - -I$(SRCROOT)/../FilzaTweak
          - -I$(SRCROOT)/../FilzaTweak/kexploit
          - -I$(SRCROOT)/../FilzaTweak/kpf
          - -I$(SRCROOT)/../FilzaTweak/XPF/src
          - -I$(SRCROOT)/../FilzaTweak/XPF/external/ChOma/include
          # 照 FilzaTweak/Makefile 里那串
          - -Wno-unused-function
          - -Wno-unused-variable
          - -Wno-unused-but-set-variable
          - -Wno-incompatible-pointer-types
          - -Wno-incompatible-pointer-types-discards-qualifiers
          - -Wno-deprecated-declarations
          - -Wno-nonportable-include-path
          - -Wno-format
          - -Wno-implicit-function-declaration
          - -Wno-everything
        OTHER_LDFLAGS:
          - -framework
          - Foundation
          - -framework
          - UIKit
          - -framework
          - CoreFoundation
          - -framework
          - IOKit
          # 漏洞用 IOSurfaceCreate / IOSurfaceGetBaseAddress / IOSurfacePrefetchPages
          - -framework
          - IOSurface
          - -lz
          - -lsandbox
